name: "General Feedback & Suggestions"
description: "Share general feedback, user experience comments, or questions about Apollo Flight."
title: "[FEEDBACK] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate pilot thoughts, impressions, and feedback!

  - type: dropdown
    id: category
    attributes:
      label: Feedback Category
      options:
        - "User Experience & Interface (UI/UX)"
        - "Telemetry & Calculation Accuracy"
        - "Performance & Resource Usage"
        - "OurAirports & Navigation Data"
        - "Documentation & Setup Guide"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Your Feedback
      description: What thoughts, observations, or suggestions would you like to share?
      placeholder: "Share your experience using Apollo Flight, what works well, or areas for improvement..."
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Apollo Flight Version
      description: Version of Apollo Flight you are currently running.
      placeholder: "e.g. v0.0.3"
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Pilot Name / Call-Sign (Optional)
      description: Optional contact name or pilot handle.
      placeholder: "e.g. Captain Miller / pilot@example.com"
    validations:
      required: false
