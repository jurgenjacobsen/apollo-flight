name: Continuous Integration

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version synchronization
        run: pnpm version:check

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run frontend test suite
        run: pnpm test

  backend:
    name: Backend (Rust Check, Test & Clippy)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove local machine Cargo config
        run: rm -f ../.cargo/config.toml .cargo/config.toml
        shell: bash

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo check
        run: cargo check --all-targets

      - name: Run Rust test suite
        run: cargo test --lib

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  tag-release-check:
    name: Release Tag Verification
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag format
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG_NAME (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$TAG_NAME" != "v$PKG_VERSION" ]]; then
            echo "Tag $TAG_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi
          echo "Validated release tag: $TAG_NAME"
        shell: bash

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production frontend bundle
        run: pnpm run build
