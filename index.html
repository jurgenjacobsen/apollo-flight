<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Icon.svg" />
    <link rel="alternate icon" type="image/png" href="/Icon.png" />
    <link rel="apple-touch-icon" href="/Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modern flight tracking, telemetry analysis, and IFR companion for Microsoft Flight Simulator." />
    <meta name="author" content="Jürgen Jacobsen" />
    <title>Apollo Flight</title>
    <script>
      (function() {
        try {
          if (window.location.search && window.location.search.includes('overlay=touchdown')) {
            document.documentElement.style.background = 'transparent';
          }
          const raw = localStorage.getItem('apollo-flight-store');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            } else if (parsed && parsed.state && parsed.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0a0d14] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
